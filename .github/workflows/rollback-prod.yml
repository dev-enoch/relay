name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Previous image tag to rollback to
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            cd /opt/relay

            docker pull ghcr.io/${{ github.repository_owner }}/relay:${{ github.event.inputs.previous_tag }}
            docker rm -f relay-app || true
            docker run -d \
              --name relay-app \
              --restart unless-stopped \
              --env-file .env.production \
              -p 3000:3000 \
              ghcr.io/${{ github.repository_owner }}/relay:${{ github.event.inputs.previous_tag }}

      - name: Verify rollback
        run: |
          curl --fail --silent http://${{ secrets.PROD_SSH_HOST }}:3000/health/ready
