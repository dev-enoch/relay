name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest
  workflow_run:
    workflows: ["Release Image"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            mkdir -p /opt/relay
            cd /opt/relay

            cat > .env.production <<'EOF'
            PORT=3000
            NODE_ENV=production
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            DATABASE_USER=${{ secrets.PROD_DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.PROD_DATABASE_PASSWORD }}
            DATABASE_NAME=${{ secrets.PROD_DATABASE_NAME }}
            REDIS_HOST=${{ secrets.PROD_REDIS_HOST }}
            REDIS_PORT=${{ secrets.PROD_REDIS_PORT }}
            API_KEY=${{ secrets.PROD_API_KEY }}
            EOF

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository_owner }}/relay:${{ steps.image-tag.outputs.value }}

            docker rm -f relay-app || true
            docker run -d \
              --name relay-app \
              --restart unless-stopped \
              --env-file .env.production \
              -p 3000:3000 \
              ghcr.io/${{ github.repository_owner }}/relay:${{ steps.image-tag.outputs.value }}

            docker image prune -f

      - name: Health check
        run: |
          curl --fail --silent http://"${{ secrets.PROD_SSH_HOST }}":3000/health/ready
